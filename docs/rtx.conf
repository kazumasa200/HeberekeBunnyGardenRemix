# HeberekeBunnyGardenRemix: Remix の開発メニューの入力用の窓を作らない。
# その窓はキーボードの raw input を RIDEV_NOLEGACY で横取りするので、ゲームのキー操作が効かなくなる（コントローラーだけ効く）。
rtx.useNewGuiInputMethod = False

# 空はゲームの空（Mod がドームライトにして渡す）。Remix Plus の物理の空（NUMOS）は使わない。使うときのために、太陽は地平線の下にしておく
rtx.skyMode = 0
rtx.atmosphere.sunElevation = -30
rtx.atmosphere.realMoonEnabled = False

# 自動露出は夜を昼の明るさまで持ち上げてしまうので切り、露出を決め打ちにする（色はゲームのポストプロセスが付ける）
rtx.autoExposure.enabled = False
rtx.tonemap.exposureBias = -2
# Remix のトーンマップは切る。露出 -2 段で 0〜1 に収めて出し、Mod が描画スレッドで 4 倍（+2 段）に戻してゲームの尺度の HDR にする。
# トーンマップと色調補正はゲームのポストプロセスがする
rtx.tonemap.tonemappingEnabled = False
# Unity は 1 単位 = 1 m。Remix の既定は 1 単位 = 1 cm（霧の距離などが変わる）
rtx.sceneScale = 0.01
# 霧はゲームの霧を Mod が Unity の側で掛ける。Remix の体積の霧は光を散らす物でゲームの霧の色にならないので切る
rtx.volumetrics.enable = False
